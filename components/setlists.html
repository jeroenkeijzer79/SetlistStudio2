<section class="panel panel-setlists" aria-label="Setlists" id="panel-setlists">
      <div class="panel-header">
        <h2>Setlists</h2>
        <button type="button" class="icon-btn setlists-sidebar-toggle" id="toggle-setlists-sidebar" aria-label="Setlists inklappen" title="Setlists inklappen">
          <svg class="setlists-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>
      <div class="setlists-filters">
        <label class="setlist-filter-toggle" title="Verberg setlists waarvan de datum voorbij is">
          <input type="checkbox" id="show-future-setlists-only">
          <span>Toekomstige setlists</span>
        </label>
        <button type="button" class="btn btn-accent" id="new-setlist-btn" aria-label="Nieuwe setlist" title="Nieuwe setlist">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div id="new-setlist-form-slot"></div>
      <div class="setlists-list" id="setlists-list"></div>
    </section>
