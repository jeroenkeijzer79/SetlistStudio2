<!doctype html>
<html lang="nl">
<head>
  <link rel="stylesheet" href="styles.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeroen & Irene - Setlist Studio Mobile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
</head>
<body>
<div class="app-version" aria-label="Versie">v2.0</div>




<div class="app">
  <header class="topbar" data-component="topbar"></header>

  <div id="settings-overlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-label="Instellingen">
    <div class="settings-modal-card">
      <div class="settings-modal-header">
        <h2>Instellingen</h2>
        <button type="button" class="icon-btn" id="settings-close-btn" aria-label="Sluiten" title="Sluiten">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="settings-panel" class="settings-panel"></div>
    </div>
  </div>

  <div id="banner" class="banner" hidden role="status"></div>

  <div id="auth-gate" class="auth-gate" hidden role="dialog" aria-modal="true" aria-label="Inloggen vereist">
    <form id="auth-gate-form" class="auth-gate-card">
      <h2>Inloggen vereist</h2>
      <p class="hint">Deze setlist-omgeving is afgeschermd. Vraag Jeroen om een gebruikersnaam en wachtwoord.</p>
      <input type="text" class="input" id="auth-gate-username" placeholder="Gebruikersnaam" aria-label="Gebruikersnaam" autocomplete="username" required>
      <input type="password" class="input" id="auth-gate-password" placeholder="Wachtwoord" aria-label="Wachtwoord" autocomplete="current-password" required>
      <p class="field-error" id="auth-gate-error" hidden></p>
      <button type="submit" class="btn btn-accent" id="auth-gate-submit">Inloggen</button>
    </form>
  </div>

  <div id="add-track-modal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-label="Nummer toevoegen">
    <form id="add-track-form" class="modal-card">
      <h2>Nummer toevoegen</h2>
      <input type="text" class="input" id="new-track-title" placeholder="Titel" aria-label="Titel van nieuw nummer" required>
      <input type="text" class="input" id="new-track-artist" placeholder="Artiest (optioneel)" aria-label="Oorspronkelijke artiest">
      <input type="text" class="input" id="new-track-genre" placeholder="Genre (optioneel)" aria-label="Genre" list="genre-datalist">
      <input type="text" class="input" id="new-track-programma" placeholder="Programma (optioneel)" aria-label="Programma (piano-instelling)">
      <input type="text" class="input input-duration mono" id="new-track-duration" placeholder="mm:ss" aria-label="Duur (mm:ss)" required>
      <p class="field-error" id="add-track-error" hidden></p>
      <div class="modal-card-actions">
        <button type="button" class="btn btn-ghost" id="add-track-cancel-btn">Annuleren</button>
        <button type="submit" class="btn btn-accent">Toevoegen</button>
      </div>
    </form>
  </div>

  <div id="export-format-modal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-label="Downloadformaat kiezen">
    <div class="modal-card">
      <h2>Downloadformaat kiezen</h2>
      <p class="hint">Kies het formaat waarin je de actieve setlist wilt downloaden.</p>
      <div class="modal-card-actions">
        <button type="button" class="btn btn-ghost" data-export-format="pdf">PDF</button>
        <button type="button" class="btn btn-accent" data-export-format="docx">Word</button>
      </div>
    </div>
  </div>

  <div id="add-existing-track-modal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-label="Nummer toevoegen aan setlist">
    <div class="modal-card modal-card-wide">
      <h2>Nummer toevoegen aan setlist</h2>
      <input type="search" class="input" id="add-existing-track-search" placeholder="Zoek nummer…" aria-label="Zoek nummer">
      <div class="picker-list" id="add-existing-track-list"></div>
      <div class="modal-card-actions">
        <button type="button" class="btn btn-accent" id="add-existing-track-done-btn">Klaar</button>
      </div>
    </div>
  </div>

  <main class="layout">
    <section class="panel panel-library" data-component="library"></section>

    <div class="resize-handle" id="resize-handle-1" role="separator" aria-orientation="vertical" aria-label="Breedte van het eerste blok aanpassen" tabindex="0"><span class="resize-handle-bar"></span></div>

    <section class="panel panel-setlists" data-component="setlists"></section>

    <div class="resize-handle" id="resize-handle-2" role="separator" aria-orientation="vertical" aria-label="Breedte van het tweede blok aanpassen" tabindex="0"><span class="resize-handle-bar"></span></div>

    <section class="panel panel-editor" data-component="active-setlist"></section>
  </main>
</div>

<script>

<script>
(function(){

  function escapeHtml(s){

    });
  }
  function plural(n, sing, plur){ return n === 1 ? sing : plur; }
  function parseDuration(raw){
    if (raw == null) return null;
    var str = String(raw).trim();
    if (!str) return null;
    if (/^\d+$/.test(str)) return parseInt(str, 10);
    var parts = str.split(":");
    if (parts.length < 2 || parts.length > 3) return null;
    for (var i=0;i<parts.length;i++){ if(!/^\d{1,2}$/.test(parts[i].trim())) return null; }
    var secs = 0;
    for (var j=0;j<parts.length;j++){ secs = secs*60 + parseInt(parts[j],10); }
    return secs;
  }
  function formatDuration(totalSec){
    totalSec = Math.max(0, Math.round(totalSec || 0));
    var h = Math.floor(totalSec/3600);
    var m = Math.floor((totalSec%3600)/60);
    var s = totalSec%60;
    if (h>0) return h + ":" + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
    return m + ":" + String(s).padStart(2,"0");
  }
  // Formats a <input type="date"> value ("YYYY-MM-DD") as a short Dutch date, e.g. "14 sep 2026".
  function formatDateNl(dateStr){
    if (!dateStr) return "";
    var parts = String(dateStr).split("-");
    if (parts.length !== 3) return "";
    var y = parseInt(parts[0],10), m = parseInt(parts[1],10), d = parseInt(parts[2],10);
    if (!y || !m || !d) return "";
    var months = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
    if (m < 1 || m > 12) return "";
    return d + " " + months[m-1] + " " + y;
  }
  function csvEscape(v){
    v = String(v);
    if (/[";\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
    return v;
  }
  function uid(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }
  var ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
  var ICON_PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  var ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';
  var ICON_PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  var ICON_HANDLE = '<svg viewBox="0 0 8 20" fill="currentColor"><circle cx="2" cy="3" r="1.4"/><circle cx="6" cy="3" r="1.4"/><circle cx="2" cy="10" r="1.4"/><circle cx="6" cy="10" r="1.4"/><circle cx="2" cy="17" r="1.4"/><circle cx="6" cy="17" r="1.4"/></svg>';
  var ICON_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>';
  var ICON_DOWN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  var ICON_DOWNLOAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>';
  var ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  // ---------- state ----------

  var activeSetlistId = null;

  var FIREBASE_CONFIG_KEY = "setlist-studio:firebase-config";
  var PENDING_MIGRATION_KEY = "setlist-studio:pending-migration";
  // Baked-in project so cloud sync works for every visitor out of the box,

  var DEFAULT_FIREBASE_CONFIG = {
    apiKey: "AIzaSyDBa9pD6xCjtjxYOoxcdK8Feor2rV-0_U4",
    authDomain: "setliststudio-d2ab1.firebaseapp.com",
    projectId: "setliststudio-d2ab1",
    storageBucket: "setliststudio-d2ab1.firebasestorage.app",
    messagingSenderId: "277799225691",
    appId: "1:277799225691:web:11626315899993590bf27e",
    measurementId: "G-PVSDB64C41"
  };
  // ---------- theme (per-device colour overrides) ----------
  var THEME_KEY = "setlist-studio:theme";
  var THEME_LIBRARY_KEY = "setlist-studio:themes";
  var THEME_DEFAULT_KEY = "setlist-studio:default-theme";
  var DEFAULT_THEME = {bg:"#161616", surface:"#232323", surface2:"#2d2b29", border:"#413e3a", accent:"#f4673b", text:"#f5f3f0", textMuted:"#a89f96", shadowColor:"#000000", resizeHandleColor:"#413e3a"};

  function loadThemeOverride(){
    try{
      var raw = window.localStorage.getItem(THEME_KEY);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      return (obj && typeof obj === "object") ? obj : null;
    } catch(e){ return null; }
  }
  function saveThemeOverride(theme){
    try{ window.localStorage.setItem(THEME_KEY, JSON.stringify(theme)); } catch(e){ /* ignore */ }
  }
  function clearThemeOverride(){
    try{ window.localStorage.removeItem(THEME_KEY); } catch(e){ /* ignore */ }
  }
  function loadSavedThemes(){
    try{
      var raw = window.localStorage.getItem(THEME_LIBRARY_KEY);
      if (!raw) return [];
      var list = JSON.parse(raw);
      if (!Array.isArray(list)) return [];
      return list.filter(function(item){
        return item && typeof item.id === "string" && typeof item.name === "string" && item.theme && typeof item.theme === "object";
      });
    } catch(e){ return []; }
  }
  function saveSavedThemes(list){
    try{ window.localStorage.setItem(THEME_LIBRARY_KEY, JSON.stringify(list)); } catch(e){ /* ignore */ }
  }
  function loadDefaultThemeId(){
    try{ return window.localStorage.getItem(THEME_DEFAULT_KEY) || ""; } catch(e){ return ""; }
  }
  function saveDefaultThemeId(id){
    try{ window.localStorage.setItem(THEME_DEFAULT_KEY, id); } catch(e){ /* ignore */ }
  }
  function clearDefaultThemeId(){
    try{ window.localStorage.removeItem(THEME_DEFAULT_KEY); } catch(e){ /* ignore */ }
  }
  function getSavedDefaultTheme(){
    var id = loadDefaultThemeId();
    if (!id) return null;
    var list = loadSavedThemes();
    for (var i=0;i<list.length;i++){
      if (list[i].id === id) return list[i].theme;
    }
    return null;
  }
  function currentTheme(){
    return Object.assign({}, DEFAULT_THEME, loadThemeOverride() || getSavedDefaultTheme() || {});
  }
  function themeId(){
    return "theme-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }
  function hexToRgb(hex){
    var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || "");
    if (!m) return {r:0, g:0, b:0};
    return {r: parseInt(m[1],16), g: parseInt(m[2],16), b: parseInt(m[3],16)};
  }
  function rgbToHex(r,g,b){
    function h(n){ return Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2,"0"); }
    return "#" + h(r) + h(g) + h(b);
  }
  function darkenHex(hex, amount){
    var c = hexToRgb(hex);
    return rgbToHex(c.r*(1-amount), c.g*(1-amount), c.b*(1-amount));
  }
  function relativeLuminance(hex){
    var c = hexToRgb(hex);
    function lin(v){ v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); }
    return 0.2126*lin(c.r) + 0.7152*lin(c.g) + 0.0722*lin(c.b);
  }
  // Accent-strong (button border/hover) and accent-contrast (button text)
  // are derived from the chosen button colour rather than picked
  // separately, so a custom button colour still looks coherent.
  function applyTheme(theme){
    var root = document.documentElement.style;
    root.setProperty("--bg", theme.bg);
    root.setProperty("--surface", theme.surface);
    root.setProperty("--surface-2", theme.surface2);
    root.setProperty("--border", theme.border);
    root.setProperty("--text", theme.text);
    root.setProperty("--text-muted", theme.textMuted);
    root.setProperty("--shadow-color", theme.shadowColor || "#000000");
    root.setProperty("--resize-handle-color", theme.resizeHandleColor || theme.border || "#413e3a");
    root.setProperty("--accent", theme.accent);
    root.setProperty("--accent-strong", darkenHex(theme.accent, 0.15));
    root.setProperty("--accent-contrast", relativeLuminance(theme.accent) > 0.45 ? "#20120a" : "#fdf6f0");
  }

  // ---------- display settings (per-device) ----------

  }
  function saveShowProgrammaSetting(val){

  }
  function hideBannerIfMatches(){ /* no-op placeholder for future auto-hide logic */ }

  function requestConfirm(key, renderFn){
    if (pendingConfirm.has(key)){
      clearTimeout(pendingConfirm.get(key));
      pendingConfirm.delete(key);
      return true;
    }
    var t = setTimeout(function(){ pendingConfirm.delete(key); renderFn(); }, 3000);
    pendingConfirm.set(key, t);
    renderFn();
    return false;
  }

  // localStorage is the persistence fallback for hosting outside Claude
  // (e.g. GitHub Pages), where the `db` capability doesn't exist.
  function probeLocalStorage(){
    try{
      var k = "__setlist_studio_probe__";
      window.localStorage.setItem(k, "1");
      window.localStorage.removeItem(k);
      return true;
    } catch(e){ return false; }
  }
  function loadLocal(){
    try{
      var t = JSON.parse(window.localStorage.getItem(STORAGE_KEY_TRACKS) || "[]");
      var s = JSON.parse(window.localStorage.getItem(STORAGE_KEY_SETLISTS) || "[]");
      t.forEach(function(item){ if (item && item.id) tracksMap.set(item.id, item); });
      s.forEach(function(item){ if (item && item.id) setlistsMap.set(item.id, item); });
    } catch(e){ /* corrupt or blocked; start empty */ }
  }
  function persistLocal(){
    if (!localStorageOk) return;
    try{
      window.localStorage.setItem(STORAGE_KEY_TRACKS, JSON.stringify(Array.from(tracksMap.values())));
      window.localStorage.setItem(STORAGE_KEY_SETLISTS, JSON.stringify(Array.from(setlistsMap.values())));
    } catch(e){ /* storage full or blocked; ignore */ }
  }

  function totalDurationFor(sl){
    var total = 0;
    sl.trackIds.forEach(function(tid){
      var t = tracksMap.get(tid);
      if (t) total += (t.durationSec || 0);
    });
    return total;
  }

  // "Praatje" tracks are spoken interludes, not songs — they still count

  function songCount(sl){
    var n = 0;
    sl.trackIds.forEach(function(tid){
      var t = tracksMap.get(tid);
      if (!t || t.genre !== "Praatje") n++;
    });
    return n;
  }

  var storeMode = "memory"; // "claude" | "cloud" | "local" | "memory"

  // version only — the Claude-hosted version is already access-controlled

  // per project once he's signed in himself. Real enforcement lives in the
  // Firestore security rules, not in this client-side check — the rules
  // must reference the same `meta/settings.requireLogin` flag this reads.
  var fbApp = null;
  var authInstance = null;
  var authRequired = false;
  var currentUser = null;
  var remoteSubscribed = false;
  var unsubTracks = null;
  var unsubSetlists = null;
  var unsubSettings = null;

  // Tri-state resolution of which Firebase project (if any) this device
  // should use: an explicit "disabled" marker wins (the visitor turned
  // cloud sync off here), then a per-device custom override, then the
  // built-in default so it works for everyone with zero setup.
  function resolveFirebaseConfig(){
    var raw = null;
    try{ raw = window.localStorage.getItem(FIREBASE_CONFIG_KEY); } catch(e){ /* ignore */ }
    if (raw === "disabled"){ firebaseConfigSource = null; return null; }
    if (raw){
      try{
        var obj = JSON.parse(raw);
        if (obj && obj.apiKey && obj.projectId){ firebaseConfigSource = "custom"; return obj; }
      } catch(e){ /* ignore, fall through to default */ }
    }
    if (DEFAULT_FIREBASE_CONFIG){ firebaseConfigSource = "default"; return DEFAULT_FIREBASE_CONFIG; }
    firebaseConfigSource = null;
    return null;
  }
  function saveFirebaseConfig(cfg){
    try{ window.localStorage.setItem(FIREBASE_CONFIG_KEY, JSON.stringify(cfg)); } catch(e){ /* ignore */ }
  }
  function clearFirebaseConfig(){
    try{ window.localStorage.removeItem(FIREBASE_CONFIG_KEY); } catch(e){ /* ignore */ }
  }
  function disableFirebaseConfig(){
    try{ window.localStorage.setItem(FIREBASE_CONFIG_KEY, "disabled"); } catch(e){ /* ignore */ }
  }
  // Accepts either the raw `const firebaseConfig = {...};` snippet Firebase
  // shows in its console, or plain JSON.
  function parseFirebaseConfigInput(text){
    var match = String(text || "").match(/\{[\s\S]*\}/);
    if (!match) return null;
    var objText = match[0];
    try{
      var obj = new Function("return (" + objText + ");")();
      if (obj && typeof obj === "object" && obj.apiKey && obj.projectId) return obj;
    } catch(e){ /* fall through to strict JSON */ }
    try{
      var asJson = JSON.parse(objText);
      if (asJson && asJson.apiKey && asJson.projectId) return asJson;
    } catch(e){ /* ignore */ }
    return null;
  }

  function importSectionHtml(){

      '<div class="settings-divider"></div>' +

  function handleConnectFirebase(){
    var input = document.getElementById("firebase-config-input");
    var errorEl = document.getElementById("firebase-config-error");
    var cfg = parseFirebaseConfigInput(input ? input.value : "");
    if (!cfg){
      if (errorEl){ errorEl.textContent = "Kon de configuratie niet lezen. Plak het volledige firebaseConfig-object zoals Firebase het toont (met apiKey en projectId)."; errorEl.hidden = false; }
      return;
    }
    try{
      var pending = { tracks: Array.from(tracksMap.values()), setlists: Array.from(setlistsMap.values()) };
      if (pending.tracks.length || pending.setlists.length){
        window.sessionStorage.setItem(PENDING_MIGRATION_KEY, JSON.stringify(pending));
      }
    } catch(e){ /* ignore */ }
    saveFirebaseConfig(cfg);
    window.location.reload();
  }
  function handleDisconnectFirebase(){
    // Explicitly marks this device as opted out, rather than just clearing
    // the override — otherwise, with a built-in default configured, the
    // page would immediately reconnect to that same default on reload.
    disableFirebaseConfig();
    window.location.reload();
  }
  function handleReenableFirebase(){
    clearFirebaseConfig();
    window.location.reload();
  }

  function loadScript(src){
    return new Promise(function(resolve, reject){
      var s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = function(){ reject(new Error("kon " + src + " niet laden")); };
      document.head.appendChild(s);
    });
  }
  var firebaseSdkLoadPromise = null;
  function loadFirebaseSdk(){
    if (window.firebase && window.firebase.firestore && window.firebase.auth) return Promise.resolve();
    if (firebaseSdkLoadPromise) return firebaseSdkLoadPromise;
    var FB_VERSION = "10.13.2";
    firebaseSdkLoadPromise = loadScript("https://www.gstatic.com/firebasejs/" + FB_VERSION + "/firebase-app-compat.js")
      .then(function(){ return loadScript("https://www.gstatic.com/firebasejs/" + FB_VERSION + "/firebase-firestore-compat.js"); })
      .then(function(){ return loadScript("https://www.gstatic.com/firebasejs/" + FB_VERSION + "/firebase-auth-compat.js"); })
      .catch(function(e){ firebaseSdkLoadPromise = null; throw e; });
    return firebaseSdkLoadPromise;
  }
  async function initFirebase(config){
    await loadFirebaseSdk();
    if (!window.firebase || !window.firebase.firestore) throw new Error("Firebase SDK niet beschikbaar.");
    var app;
    try{ app = window.firebase.initializeApp(config); }
    catch(e){ app = window.firebase.initializeApp(config, "setlist-studio-" + Date.now()); }
    return {db: window.firebase.firestore(app), app: app};
  }

  // Firebase's email/password sign-in needs an email-shaped identifier, so
  // a plain username is mapped onto a fixed fake domain. Jeroen must use
  // this exact same convention when adding a user in the Firebase console
  // (Authentication → Users → Add user): email field = <username>@setlist-studio.local.
  function usernameToEmail(username){
    var clean = String(username || "").trim().toLowerCase().replace(/[^a-z0-9._-]/g, "");
    return clean + "@setlist-studio.local";
  }
  function emailToUsername(email){
    return String(email || "").split("@")[0];
  }

  function subscribeRemote(){
    unsubTracks = db.collection("tracks").onSnapshot(function(snap){
      tracksMap.clear();
      snap.docs.forEach(function(d){ tracksMap.set(d.id, Object.assign({id:d.id}, d.data())); });
      renderLibrary(); renderSetlistsList(); renderActiveSetlist(); renderStats();
    }, function(){ showBanner("De bibliotheek kon niet worden geladen. Probeer de pagina te vernieuwen.", "warn"); });

    unsubSetlists = db.collection("setlists").onSnapshot(function(snap){
      setlistsMap.clear();
      snap.docs.forEach(function(d){ setlistsMap.set(d.id, Object.assign({id:d.id}, d.data())); });
      if (activeSetlistId && !setlistsMap.has(activeSetlistId)) activeSetlistId = null;
      renderSetlistsList(); renderActiveSetlist(); renderLibrary(); renderStats();
    }, function(){ showBanner("De setlists konden niet worden geladen. Probeer de pagina te vernieuwen.", "warn"); });
  }

  // ---------- login gate: settings doc + auth state, kept in sync live so
  // toggling "Login vereisen" (or signing in/out) takes effect immediately
  // for everyone, without a page reload.
  function initAuthAndSettings(app){
    authInstance = window.firebase.auth(app);
    return new Promise(function(resolve){
      var settled = false;
      function settle(){ if (!settled){ settled = true; resolve(); } }
      authInstance.onAuthStateChanged(function(user){
        currentUser = user;
        handleAuthOrAccessChange();
      });
      unsubSettings = db.collection("meta").doc("settings").onSnapshot(function(doc){
        authRequired = !!(doc.exists && doc.data() && doc.data().requireLogin);
        handleAuthOrAccessChange();
        settle();
      }, function(){ settle(); });
      // Don't block the initial render forever if the settings read stalls.
      setTimeout(settle, 4000);
    });
  }

  function handleAuthOrAccessChange(){
    renderAuthGate();
    renderSettingsPanel();
    var hasAccess = !authRequired || !!currentUser;
    if (hasAccess && !remoteSubscribed){
      remoteSubscribed = true;
      subscribeRemote();
      maybeMigratePendingData();
    } else if (!hasAccess && remoteSubscribed){
      remoteSubscribed = false;
      if (unsubTracks){ unsubTracks(); unsubTracks = null; }
      if (unsubSetlists){ unsubSetlists(); unsubSetlists = null; }
      tracksMap.clear(); setlistsMap.clear(); activeSetlistId = null;
      renderLibrary(); renderSetlistsList(); renderActiveSetlist(); renderStats();
    }
  }

  function renderAuthGate(){
    if (!authGateEl) return;
    authGateEl.hidden = !(storeMode === "cloud" && authRequired && !currentUser);
  }

  function handleAuthLogin(username, password, errorEl){
    if (errorEl) errorEl.hidden = true;
    if (!username || !password){
      if (errorEl){ errorEl.textContent = "Vul gebruikersnaam en wachtwoord in."; errorEl.hidden = false; }
      return;
    }
    authInstance.signInWithEmailAndPassword(usernameToEmail(username), password).catch(function(e){
      var msg = "Inloggen mislukt. Controleer gebruikersnaam en wachtwoord.";
      if (errorEl){ errorEl.textContent = msg; errorEl.hidden = false; }
      else showBanner(msg, "warn");
    });
  }
  function handleAuthLogout(){
    if (authInstance) authInstance.signOut();
  }
  function handleToggleRequireLogin(checked){
    if (!currentUser){ showBanner("Log eerst in om deze instelling te wijzigen.", "warn"); return; }
    db.collection("meta").doc("settings").set({requireLogin: checked}, {merge:true}).catch(function(e){
      showBanner("Kon instelling niet opslaan: " + (e && e.message ? e.message : "onbekende fout") + ".", "warn");
    });
  }

  // One-time handoff: local data present before connecting cloud sync is
  // uploaded (with its original ids, so setlist track references stay
  // valid) rather than silently left behind.
  function maybeMigratePendingData(){
    var raw;
    try{ raw = window.sessionStorage.getItem(PENDING_MIGRATION_KEY); } catch(e){ raw = null; }
    if (!raw) return;
    try{ window.sessionStorage.removeItem(PENDING_MIGRATION_KEY); } catch(e){ /* ignore */ }
    var pending;
    try{ pending = JSON.parse(raw); } catch(e){ return; }
    if (!pending) return;
    var tasks = [];
    (pending.tracks || []).forEach(function(t){
      var data = Object.assign({}, t); delete data.id;
      tasks.push(db.collection("tracks").doc(t.id).set(data));
    });
    (pending.setlists || []).forEach(function(s){
      var data = Object.assign({}, s); delete data.id;
      tasks.push(db.collection("setlists").doc(s.id).set(data));
    });
    if (!tasks.length) return;
    Promise.all(tasks).then(function(){
      showBanner("Lokale nummers en setlists zijn meegenomen naar de cloud-synchronisatie.", "success");
    }).catch(function(){
      showBanner("Niet alle lokale gegevens konden worden meegenomen naar de cloud.", "warn");
    });
  }

  async function initStore(){
    // 1. The Claude artifact's own shared storage, when this page is
    //    running inside Claude.
    try{
      db = (window.claude && window.claude.use) ? await window.claude.use("db") : null;
    } catch(e){ db = null; }
    if (db){
      usingDb = true; storeMode = "claude";
      subscribeRemote();
      renderSettingsPanel();
      return;
    }

    // 2. A Firebase project — either the site's built-in default (so cloud
    //    sync works for every visitor automatically) or a per-device custom
    //    override — for sharing/collaboration when hosted outside Claude
    //    (e.g. GitHub Pages). See the settings panel (gear icon).
    var fbConfig = resolveFirebaseConfig();
    if (fbConfig){
      try{
        var fbResult = await initFirebase(fbConfig);
        db = fbResult.db; fbApp = fbResult.app;
        usingDb = true; storeMode = "cloud";
        renderSettingsPanel();
        await initAuthAndSettings(fbApp);
        renderSettingsPanel();
        return;
      } catch(e){
        showBanner("Kon niet verbinden met cloud-synchronisatie (" + (e && e.message ? e.message : "onbekende fout") + "). Tijdelijk teruggevallen op lokale opslag.", "warn");
      }
    }

    // 3. Local browser storage, or in-memory only as a last resort.
    usingDb = false;
    localStorageOk = probeLocalStorage();
    if (localStorageOk){
      loadLocal();
      storeMode = "local";
      showBanner("Nummers en setlists worden lokaal in deze browser bewaard (niet gedeeld). Wil je samenwerken? Verbind cloud-synchronisatie via het instellingen-icoon rechtsboven.");
    } else {
      storeMode = "memory";
      showBanner("Opslag is niet beschikbaar — wijzigingen worden niet bewaard na het sluiten van deze pagina.", "warn");
    }
    renderLibrary(); renderSetlistsList(); renderActiveSetlist(); renderStats();
    renderSettingsPanel();
  }

  async function addTrack(title, artist, durationSec, genre, programma){
    var data = {title: title, artist: artist || "", genre: genre || "", durationSec: durationSec, programma: programma || "", addedAt: Date.now()};
    if (usingDb){
      await db.collection("tracks").add(data);
    } else {
      var id = uid();
      tracksMap.set(id, Object.assign({id:id}, data));
      persistLocal();
      renderLibrary(); renderActiveSetlist(); renderSetlistsList(); renderStats();
    }
  }

  async function updateTrack(id, title, artist, durationSec, genre, programma){
    if (usingDb){
      await db.collection("tracks").doc(id).update({title: title, artist: artist || "", genre: genre || "", durationSec: durationSec, programma: programma || ""});
    } else {
      var t = tracksMap.get(id);
      if (t){
        t.title = title; t.artist = artist || ""; t.genre = genre || ""; t.durationSec = durationSec; t.programma = programma || "";
        persistLocal();
        renderLibrary(); renderActiveSetlist(); renderSetlistsList();
      }
    }
  }

  async function deleteTrackById(id){
    if (usingDb){
      await db.collection("tracks").doc(id).delete();
      var entries = Array.from(setlistsMap.entries());
      for (var i=0;i<entries.length;i++){
        var sid = entries[i][0], sl = entries[i][1];
        if (sl.trackIds.indexOf(id) !== -1){
          var newIds = sl.trackIds.filter(function(t){ return t !== id; });
          await db.collection("setlists").doc(sid).update({trackIds:newIds, updatedAt:Date.now()});
        }
      }
    } else {
      tracksMap.delete(id);
      setlistsMap.forEach(function(sl){
        if (sl.trackIds.indexOf(id) !== -1){
          sl.trackIds = sl.trackIds.filter(function(t){ return t !== id; });
          sl.updatedAt = Date.now();
        }
      });
      persistLocal();
      renderLibrary(); renderSetlistsList(); renderActiveSetlist(); renderStats();
    }
  }

  async function createSetlist(name){
    var data = {name: name, date: "", trackIds: [], createdAt: Date.now(), updatedAt: Date.now(), sortIndex: Date.now()};
    if (usingDb){
      var ref = await db.collection("setlists").add(data);
      activeSetlistId = ref.id;
      renderActiveSetlist();
      renderLibrary();
    } else {
      var id = uid();
      setlistsMap.set(id, Object.assign({id:id}, data));
      activeSetlistId = id;
      persistLocal();
      renderSetlistsList(); renderActiveSetlist(); renderStats();
    }
  }

  async function renameSetlist(id, name){

  async function deleteSetlist(id){
    if (usingDb){
      await db.collection("setlists").doc(id).delete();
    } else {
      setlistsMap.delete(id);
      persistLocal();
    }
    if (activeSetlistId === id) activeSetlistId = null;
    if (!usingDb){ renderSetlistsList(); renderActiveSetlist(); renderStats(); }
  }

  async function mutateSetlist(id, updater){
    var sl = setlistsMap.get(id);
    if (!sl) return;
    var newIds = updater((sl.trackIds || []).slice());
    var seenTrackIds = new Set();
    newIds = newIds.filter(function(trackId){
      if (seenTrackIds.has(trackId)) return false;
      seenTrackIds.add(trackId);
      return true;
    });

    // Update the in-memory setlist immediately as well. This is important
    // for the library filter: when a track is added to the active setlist,
    // renderLibrary() must see the new trackIds regardless of whether the
    // app uses the local store or Firestore.
    sl.trackIds = newIds;
    sl.updatedAt = Date.now();

    if (usingDb){
      await db.collection("setlists").doc(id).update({trackIds:newIds, updatedAt:sl.updatedAt});
    } else {
      persistLocal();
    }

    renderSetlistsList();
    renderActiveSetlist();
    renderLibrary();
  }

  // ---------- render ----------
  function renderStats(){
    var songTotal = Array.from(tracksMap.values()).filter(function(t){ return t.genre !== "Praatje"; }).length;
    statTracksEl.textContent = songTotal + " " + plural(songTotal, "nummer", "nummers");
    statSetlistsEl.textContent = setlistsMap.size + " " + plural(setlistsMap.size, "setlist", "setlists");
  }

  // Tracks with the "Praatje" genre (a spoken interlude, not a song) sort
  // to the bottom of the library regardless of title, since they aren't
  // part of the regular repertoire to browse alphabetically.
  function sortedTracks(){
    return Array.from(tracksMap.values()).sort(function(a,b){
      var aPraatje = (a.genre || "") === "Praatje";
      var bPraatje = (b.genre || "") === "Praatje";
      if (aPraatje !== bPraatje) return aPraatje ? 1 : -1;
      return a.title.localeCompare(b.title, "nl", {sensitivity:"base"});
    });
  }

  function distinctGenres(){
    var set = new Set();
    tracksMap.forEach(function(t){ if (t.genre) set.add(t.genre); });
    return Array.from(set).sort(function(a,b){ return a.localeCompare(b, "nl", {sensitivity:"base"}); });
  }

  function updateGenreFilterLabel(){
    var labelEl = document.getElementById("genre-filter-label");
    if (!labelEl) return;
    var n = libraryGenreFilters.size;
    if (n === 0) labelEl.textContent = "Alle genres";
    else if (n === 1) labelEl.textContent = Array.from(libraryGenreFilters)[0];
    else labelEl.textContent = n + " genres";
  }

  function updateGenreControls(){
    var genres = distinctGenres();
    var stale = [];
    libraryGenreFilters.forEach(function(g){ if (genres.indexOf(g) === -1) stale.push(g); });
    stale.forEach(function(g){ libraryGenreFilters.delete(g); });

    var popoverEl = document.getElementById("genre-filter-popover");
    if (popoverEl){
      if (genres.length === 0){
        popoverEl.innerHTML = '<p class="hint" style="margin:4px 8px;">Nog geen genres.</p>';
      } else {
        popoverEl.innerHTML = genres.map(function(g){
          var checked = libraryGenreFilters.has(g);
          return '<label class="genre-filter-option">' +
            '<input type="checkbox" value="' + escapeHtml(g) + '"' + (checked ? ' checked' : '') + '>' +
            '<span>' + escapeHtml(g) + '</span>' +
          '</label>';
        }).join("") + (libraryGenreFilters.size > 0
          ? '<button type="button" class="btn btn-ghost btn-small" id="genre-filter-clear">Filter wissen</button>'
          : '');
      }
    }
    updateGenreFilterLabel();

    var datalistEl = document.getElementById("genre-datalist");
    if (datalistEl){
      datalistEl.innerHTML = genres.map(function(g){ return '<option value="' + escapeHtml(g) + '"></option>'; }).join("");
    }
  }

    updateGenreControls();

    var term = librarySearchTerm.trim().toLowerCase();
    var activeTrackIds = new Set();
    if (activeSetlistId){
      var activeSl = setlistsMap.get(activeSetlistId);

      }

    var list = sortedTracks().filter(function(t){

  function sortSetlists(items){
    var byManual = function(a,b){
      var av = typeof a.sortIndex === "number" ? a.sortIndex : (a.createdAt||0);
      var bv = typeof b.sortIndex === "number" ? b.sortIndex : (b.createdAt||0);
      return av - bv;
    };
    return items.sort(byManual);
  }

  // Rewrites sortIndex sequentially for every setlist in the given final
  // order, so the manual arrangement persists (shared, when using a
  // remote store) rather than being a purely local/visual reorder.
  async function reorderSetlistsManual(orderedIds){
    if (usingDb){
      await Promise.all(orderedIds.map(function(id, i){
        return db.collection("setlists").doc(id).update({sortIndex: i});
      }));
    } else {
      orderedIds.forEach(function(id, i){
        var sl = setlistsMap.get(id);
        if (sl) sl.sortIndex = i;
      });
      persistLocal();
      renderSetlistsList();
    }
  }

  // ---------- CSV import/export ----------
  // Expected columns: titel, duur(mm:ss), duur(sec) — comma- or semicolon-separated.
  // duur(sec) wins when present and numeric; duur(mm:ss) is the fallback.
  function parseCsvLine(line, delim){
    var result = [];
    var cur = "";
    var inQuotes = false;
    for (var i=0;i<line.length;i++){
      var ch = line[i];
      if (inQuotes){
        if (ch === '"'){
          if (line[i+1] === '"'){ cur += '"'; i++; }
          else inQuotes = false;
        } else cur += ch;
      } else {
        if (ch === '"') inQuotes = true;
        else if (ch === delim){ result.push(cur); cur = ""; }
        else cur += ch;
      }
    }
    result.push(cur);
    return result;
  }
  function detectDelimiter(sampleLine){
    var commas = (sampleLine.match(/,/g)||[]).length;
    var semis = (sampleLine.match(/;/g)||[]).length;
    return semis > commas ? ";" : ",";
  }
  function importCsvText(text){
    var lines = text.split(/\r\n|\n|\r/).filter(function(l){ return l.trim() !== ""; });
    if (lines.length === 0) return {rows:[], added:0, skipped:0};
    var delim = detectDelimiter(lines[0]);
    var rows = [];
    var added = 0, skipped = 0;
    lines.forEach(function(line, idx){
      var fields = parseCsvLine(line, delim);
      var title = (fields[0]||"").trim().replace(/^["']|["']$/g, "");
      var mmss = (fields[1]||"").trim().replace(/^["']|["']$/g, "");
      var secField = (fields[2]||"").trim().replace(/^["']|["']$/g, "");
      var artist = (fields[3]||"").trim().replace(/^["']|["']$/g, "");
      var genre = (fields[4]||"").trim().replace(/^["']|["']$/g, "");
      if (idx === 0 && /^titel$|^title$/i.test(title)) return; // header row, ignore silently
      var durationSec = null;
      if (secField && /^\d+$/.test(secField)) durationSec = parseInt(secField, 10);
      else if (mmss) durationSec = parseDuration(mmss);
      if (!title || durationSec == null || durationSec <= 0){ skipped++; return; }
      added++;
      rows.push({title:title, artist:artist, genre:genre, durationSec:durationSec});
    });
    return {rows: rows, added: added, skipped: skipped};
  }

  async function handleFileImport(file){
    var text = await file.text();
    var result = importCsvText(text);
    if (result.rows.length === 0){
      showBanner("Geen geldige regels gevonden. Verwachte kolommen: titel, duur(mm:ss), duur(sec), artiest, genre — gescheiden door komma of puntkomma.", "warn");
      return;
    }
    showBanner("Bezig met importeren…");
    for (var i=0;i<result.rows.length;i++){
      await addTrack(result.rows[i].title, result.rows[i].artist, result.rows[i].durationSec, result.rows[i].genre);
    }
    var msg = result.added + " " + plural(result.added,"nummer","nummers") + " toegevoegd";
    if (result.skipped > 0) msg += ", " + result.skipped + " " + plural(result.skipped,"regel","regels") + " overgeslagen (onherkenbaar formaat)";
    showBanner(msg + ".", "success");
  }

  // ---------- Setlists import (Word/.docx) ----------
  // Reads an existing multi-page setlist document — one setlist per page,
  // pages separated by a manual page break, a "page break before"
  // paragraph setting, or a section break — and turns each page into its
  // own setlist. Track lines are matched against the existing library by
  // title (and artist, when known) so re-importing doesn't duplicate
  // library entries; unmatched tracks are added to the library.
  function docxLocalName(el){
    return el.localName || String(el.nodeName || "").replace(/^.*:/, "");
  }

  function docxParagraphText(pEl){
    var text = "";
    (function walk(node){
      var children = node.childNodes;
      for (var i=0; i<children.length; i++){
        var child = children[i];
        if (child.nodeType !== 1) continue;
        var ln = docxLocalName(child);
        if (ln === "t"){
          text += child.textContent || "";
        } else if (ln === "tab"){
          text += " ";
        } else if (ln === "br" || ln === "cr"){
          var brType = child.getAttribute && (child.getAttribute("w:type") || child.getAttribute("type"));
          text += (brType === "page") ? "\f" : "\n";
        } else if (ln !== "pPr" && ln !== "rPr"){
          walk(child);
        }
      }
    })(pEl);
    return text;
  }

  function extractDocxPages(documentXmlText){
    var xmlDoc = new DOMParser().parseFromString(documentXmlText, "application/xml");
    if (xmlDoc.getElementsByTagName("parsererror").length){
      throw new Error("Kon het Word-bestand niet lezen (onherkenbare inhoud)");
    }
    var body = null;
    var all = xmlDoc.getElementsByTagName("*");
    for (var i=0; i<all.length; i++){
      if (docxLocalName(all[i]) === "body"){ body = all[i]; break; }
    }
    if (!body) throw new Error("Geen documentinhoud gevonden in het Word-bestand");

    var pages = [];
    var currentLines = [];
    function pushLine(line){
      line = line.replace(/\s+/g, " ").trim();
      if (line) currentLines.push(line);
    }
    function endPage(){
      if (currentLines.length) pages.push(currentLines.join("\n"));
      currentLines = [];
    }

    var children = body.children;
    for (var c=0; c<children.length; c++){
      var el = children[c];
      if (docxLocalName(el) !== "p") continue;
      var pPr = null;
      for (var k=0; k<el.children.length; k++){
        if (docxLocalName(el.children[k]) === "pPr"){ pPr = el.children[k]; break; }
      }
      var hasPageBreakBefore = false, hasSectPr = false;
      if (pPr){
        for (var m=0; m<pPr.children.length; m++){
          var pn = docxLocalName(pPr.children[m]);
          if (pn === "pageBreakBefore") hasPageBreakBefore = true;
          if (pn === "sectPr") hasSectPr = true;
        }
      }
      if (hasPageBreakBefore) endPage();

      var raw = docxParagraphText(el);
      var segments = raw.split("\f");
      for (var s=0; s<segments.length; s++){
        if (s > 0) endPage();
        // A plain <w:br/> inside this paragraph (e.g. between a track's
        // title and its "artiest – duur" line) becomes "\n" in the raw
        // text above — split on it too, so each becomes its own line
        // instead of being collapsed into one by pushLine's whitespace trim.
        var segLines = segments[s].split("\n");
        for (var sl=0; sl<segLines.length; sl++){
          pushLine(segLines[sl]);
        }
      }

      if (hasSectPr) endPage();
    }
    endPage();
    return pages;
  }

  // Strips a line that repeats identically across most pages (e.g. a
  // "JEROEN & IRENE" heading printed at the top of every page) so it isn't
  // mistaken for a setlist name or a track.
  function stripRepeatedHeaderLines(pageLineArrays){
    if (pageLineArrays.length < 2) return pageLineArrays;
    var firstLineCounts = new Map();
    pageLineArrays.forEach(function(lines){
      if (!lines.length) return;
      var key = lines[0].toLowerCase();
      firstLineCounts.set(key, (firstLineCounts.get(key) || 0) + 1);
    });
    var threshold = Math.max(2, Math.ceil(pageLineArrays.length / 2));
    return pageLineArrays.map(function(lines){
      if (lines.length && firstLineCounts.get(lines[0].toLowerCase()) >= threshold){
        return lines.slice(1);
      }
      return lines;
    });
  }

  var DOCX_IMPORT_DURATION_RE = /(\d{1,2}:[0-5]\d:[0-5]\d|\d{1,2}:[0-5]\d)/;
  var DOCX_IMPORT_SEP_RE = /\s[–—-]\s/;

  // Duration-anchored line parser: a track is either two lines (a title
  // line with no duration, followed by an "artiest – mm:ss" line — the
  // shape our own exports use) or one line that has both ("Titel – Artiest
  // – 3:45"). Whichever line carries the duration closes out the track.
  function parseImportedTrackLines(lines){
    var tracks = [];
    var pendingTitle = null;
    function flushPendingAsTitleOnly(){
      if (pendingTitle){
        tracks.push({title: pendingTitle, artist: "", durationSec: 0, durationKnown: false});
        pendingTitle = null;
      }
    }
    lines.forEach(function(rawLine){
      var line = rawLine.replace(/^\d+[.)]\s*/, "").trim();
      if (!line) return;
      var durMatch = line.match(DOCX_IMPORT_DURATION_RE);
      if (!durMatch){
        flushPendingAsTitleOnly();
        pendingTitle = line;
        return;
      }
      var durationSec = parseDuration(durMatch[1]);
      var rest = (line.slice(0, durMatch.index) + line.slice(durMatch.index + durMatch[0].length))
        .replace(/[()]/g, " ")
        .trim()
        .replace(/^[–—-]\s*/, "")
        .replace(/\s*[–—-]$/, "")
        .replace(/\s+/g, " ")
        .trim();
      if (pendingTitle){
        tracks.push({title: pendingTitle, artist: rest, durationSec: durationSec || 0, durationKnown: durationSec != null});
        pendingTitle = null;
        return;
      }
      if (!rest) return; // a line that's only a duration, nothing to anchor it to
      var parts = rest.split(DOCX_IMPORT_SEP_RE);
      var title = parts.shift().trim();
      var artist = parts.join(" – ").trim();
      if (title){
        tracks.push({title: title, artist: artist, durationSec: durationSec || 0, durationKnown: durationSec != null});
      }
    });
    flushPendingAsTitleOnly();
    return tracks;
  }

  function findExistingTrackId(matchIndex, title, artist){
    var key = (title||"").trim().toLowerCase() + "|" + (artist||"").trim().toLowerCase();
    if (matchIndex.byTitleArtist.has(key)) return matchIndex.byTitleArtist.get(key);
    var titleOnlyKey = (title||"").trim().toLowerCase();
    if (matchIndex.byTitle.has(titleOnlyKey)) return matchIndex.byTitle.get(titleOnlyKey);
    return null;
  }

  async function importTrackForSetlist(matchIndex, title, artist, durationSec){
    var existingId = findExistingTrackId(matchIndex, title, artist);
    if (existingId) return existingId;
    var data = {title: title, artist: artist || "", genre: "", durationSec: durationSec || 0, programma: "", addedAt: Date.now()};
    var id;
    if (usingDb){
      var ref = await db.collection("tracks").add(data);
      id = ref.id;
    } else {
      id = uid();
    }
    tracksMap.set(id, Object.assign({id:id}, data));
    matchIndex.byTitleArtist.set((title||"").trim().toLowerCase() + "|" + (artist||"").trim().toLowerCase(), id);
    var titleOnlyKey = (title||"").trim().toLowerCase();
    if (!matchIndex.byTitle.has(titleOnlyKey)) matchIndex.byTitle.set(titleOnlyKey, id);
    return id;
  }

  async function importCreateSetlist(name, trackIds, sortIndex){
    var data = {name: name, date: "", trackIds: trackIds, createdAt: Date.now(), updatedAt: Date.now(), sortIndex: sortIndex};
    if (usingDb){
      var ref = await db.collection("setlists").add(data);
      setlistsMap.set(ref.id, Object.assign({id:ref.id}, data));
      return ref.id;
    }
    var id = uid();
    setlistsMap.set(id, Object.assign({id:id}, data));
    return id;
  }

  async function handleSetlistDocxImport(file){
    showBanner("Bezig met het lezen van het Word-bestand…");
    var JSZipCtor;
    try{
      JSZipCtor = await loadJsZip();
    } catch(e){
      showBanner("Kon JSZip niet laden om het Word-bestand te lezen. Controleer je internetverbinding.", "warn");
      return;
    }
    var pages;
    try{
      var buffer = await file.arrayBuffer();
      var zip = await JSZipCtor.loadAsync(buffer);
      var docEntry = zip.file("word/document.xml");
      if (!docEntry) throw new Error("Dit lijkt geen geldig Word-bestand (.docx) te zijn");
      var xmlText = await docEntry.async("string");
      pages = extractDocxPages(xmlText);
    } catch(e){
      showBanner("Kon het Word-bestand niet verwerken: " + (e && e.message ? e.message : "onbekende fout") + ".", "warn");
      return;
    }
    if (pages.length === 0){
      showBanner("Geen pagina's met inhoud gevonden in het Word-bestand.", "warn");
      return;
    }

    var pageLineArrays = stripRepeatedHeaderLines(pages.map(function(p){
      return p.split("\n").map(function(l){ return l.trim(); }).filter(Boolean);
    }));

    var matchIndex = {byTitleArtist: new Map(), byTitle: new Map()};
    tracksMap.forEach(function(t, id){
      var key = (t.title||"").trim().toLowerCase() + "|" + (t.artist||"").trim().toLowerCase();
      matchIndex.byTitleArtist.set(key, id);
      var titleKey = (t.title||"").trim().toLowerCase();
      if (!matchIndex.byTitle.has(titleKey)) matchIndex.byTitle.set(titleKey, id);
    });

    var maxSortIndex = 0;
    setlistsMap.forEach(function(sl){
      if (typeof sl.sortIndex === "number" && sl.sortIndex > maxSortIndex) maxSortIndex = sl.sortIndex;
    });

    var setlistsCreated = 0, tracksMatched = 0, tracksCreated = 0, pagesSkipped = 0, tracksNeedDuration = 0;

    for (var p=0; p<pageLineArrays.length; p++){
      var lines = pageLineArrays[p].filter(function(l){ return !/^totale?\s*duur/i.test(l); });
      if (!lines.length){ pagesSkipped++; continue; }
      var name = lines[0];
      var trackLines = lines.slice(1);
      var parsedTracks = parseImportedTrackLines(trackLines);
      if (parsedTracks.length === 0){ pagesSkipped++; continue; }

      var trackIds = [];
      for (var t=0; t<parsedTracks.length; t++){
        var pt = parsedTracks[t];
        var existed = findExistingTrackId(matchIndex, pt.title, pt.artist) != null;
        var id = await importTrackForSetlist(matchIndex, pt.title, pt.artist, pt.durationSec);
        trackIds.push(id);
        if (existed) tracksMatched++; else tracksCreated++;
        if (!pt.durationKnown) tracksNeedDuration++;
      }

      maxSortIndex += 1;
      await importCreateSetlist(name || ("Geïmporteerde setlist " + (setlistsCreated+1)), trackIds, maxSortIndex);
      setlistsCreated++;
    }

    if (!usingDb) persistLocal();
    renderLibrary(); renderSetlistsList(); renderActiveSetlist(); renderStats();

    if (setlistsCreated === 0){
      showBanner("Er konden geen setlists worden herkend in dit Word-bestand.", "warn");
      return;
    }
    var msg = setlistsCreated + " " + plural(setlistsCreated,"setlist","setlists") + " geïmporteerd" +
      " (" + tracksMatched + " " + plural(tracksMatched,"nummer","nummers") + " herkend uit je bibliotheek, " +
      tracksCreated + " nieuw toegevoegd)";
    if (tracksNeedDuration > 0){
      msg += ". Let op: bij " + tracksNeedDuration + " " + plural(tracksNeedDuration,"nummer","nummers") +
        " kon geen duur worden herkend — pas deze aan in de bibliotheek.";
    } else {
      msg += ".";
    }
    if (pagesSkipped > 0){
      msg += " " + pagesSkipped + " lege of onherkenbare " + plural(pagesSkipped,"pagina","pagina's") + " overgeslagen.";
    }
    showBanner(msg, tracksNeedDuration > 0 ? "warn" : "success");
  }

  function buildSetlistCsv(sl){
    var rows = [["#","Titel","Artiest","Duur (mm:ss)"]];
    var total = 0;
    sl.trackIds.forEach(function(tid, i){
      var t = tracksMap.get(tid);
      var title = t ? t.title : "(verwijderd nummer)";
      var artist = t ? (t.artist || "") : "";
      var dur = t ? t.durationSec : 0;
      total += dur;
      rows.push([String(i+1), title, artist, formatDuration(dur)]);
    });
    rows.push(["", "Totale duur", "", formatDuration(total)]);
    return "﻿" + rows.map(function(r){ return r.map(csvEscape).join(";"); }).join("\r\n");
  }

  // Plain-browser fallback (works on a normal host like GitHub Pages;
  // inert inside the Claude artifact sandbox, where `downloads` is used instead).
  function downloadBlobViaBrowser(blob, filename){
    try{
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      return true;
    } catch(e){ return false; }
  }

  // Saves a blob for the user, preferring the Claude artifact's own
  // download capability (same as track/setlist exports) and falling back
  // to a plain-browser download outside Claude.
  async function saveFileForUser(blob, filename){
    try{
      var downloads = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null;
      if (downloads){
        await downloads.save({filename: filename, data: blob});
        return true;
      }
    } catch(e){
      if (e && e.code === "declined") return false;
      // fall through to the plain-browser download below
    }
    return downloadBlobViaBrowser(blob, filename);
  }

  // ---------- full backup (export/import of everything) ----------
  function buildBackupPayload(){
    return {
      app: "setlist-studio-backup",
      version: 1,
      exportedAt: new Date().toISOString(),
      tracks: Array.from(tracksMap.values()),
      setlists: Array.from(setlistsMap.values())
    };
  }

  async function handleBackupExport(){
    var payload = buildBackupPayload();
    var json = JSON.stringify(payload, null, 2);
    var blob = new Blob([json], {type:"application/json;charset=utf-8;"});
    var stamp = new Date().toISOString().slice(0,10);
    var ok = await saveFileForUser(blob, "setlist-studio-backup-" + stamp + ".json");
    if (ok){
      showBanner("Back-up gedownload (" + payload.tracks.length + " " + plural(payload.tracks.length,"nummer","nummers") + ", " + payload.setlists.length + " " + plural(payload.setlists.length,"setlist","setlists") + ").", "success");
    } else {
      showBanner("Back-up downloaden is niet gelukt.", "warn");
    }
  }

  // Fully replaces the library and all setlists with the contents of a
  // backup, preserving original ids so setlists keep pointing at the right
  // tracks. In cloud mode the live onSnapshot listeners pick the change up
  // and re-render automatically once the writes land.
  async function restoreFromBackup(payload){
    var tracks = Array.isArray(payload.tracks) ? payload.tracks.filter(function(t){ return t && t.id; }) : [];
    var setlists = Array.isArray(payload.setlists) ? payload.setlists.filter(function(s){ return s && s.id; }) : [];

    if (usingDb){
      var deleteTasks = [];
      tracksMap.forEach(function(t){ deleteTasks.push(db.collection("tracks").doc(t.id).delete()); });
      setlistsMap.forEach(function(s){ deleteTasks.push(db.collection("setlists").doc(s.id).delete()); });
      await Promise.all(deleteTasks);

      var writeTasks = [];
      tracks.forEach(function(t){
        var data = Object.assign({}, t); delete data.id;
        writeTasks.push(db.collection("tracks").doc(t.id).set(data));
      });
      setlists.forEach(function(s){
        var data = Object.assign({}, s); delete data.id;
        writeTasks.push(db.collection("setlists").doc(s.id).set(data));
      });
      await Promise.all(writeTasks);
    } else {
      tracksMap.clear();
      setlistsMap.clear();
      tracks.forEach(function(t){ tracksMap.set(t.id, t); });
      setlists.forEach(function(s){ setlistsMap.set(s.id, s); });
      activeSetlistId = null;
      persistLocal();
      renderLibrary(); renderSetlistsList(); renderActiveSetlist(); renderStats();
    }
    renderSettingsPanel();
    showBanner("Back-up hersteld: " + tracks.length + " " + plural(tracks.length,"nummer","nummers") + " en " + setlists.length + " " + plural(setlists.length,"setlist","setlists") + ".", "success");
  }

  function handleBackupImportFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      var payload;
      try{ payload = JSON.parse(String(reader.result)); }
      catch(e){ showBanner("Dit bestand is geen geldige back-up (ongeldige JSON).", "warn"); return; }
      if (!payload || !Array.isArray(payload.tracks) || !Array.isArray(payload.setlists)){
        showBanner("Dit bestand is geen geldige setlist-studio back-up.", "warn");
        return;
      }
      var msg = "Dit vervangt je huidige bibliotheek (" + tracksMap.size + " " + plural(tracksMap.size,"nummer","nummers") +
        ") en al je setlists (" + setlistsMap.size + ") door de back-up (" + payload.tracks.length + " " + plural(payload.tracks.length,"nummer","nummers") +
        ", " + payload.setlists.length + " " + plural(payload.setlists.length,"setlist","setlists") + "). Dit kan niet ongedaan worden gemaakt. Doorgaan?";
      if (!window.confirm(msg)) return;
      restoreFromBackup(payload).catch(function(e){
        showBanner("Herstellen van de back-up is mislukt: " + (e && e.message ? e.message : "onbekende fout") + ".", "warn");
      });
    };
    reader.onerror = function(){ showBanner("Bestand kon niet worden gelezen.", "warn"); };
    reader.readAsText(file);
  }

  // Word export: a real, minimal .docx (Open XML) package built by hand
  // and zipped with JSZip (lazy-loaded from cdnjs, like jsPDF below).
  // A plain HTML-saved-as-.doc file was considered but the platform's
  // downloads capability only allow-lists the real "docx" extension.
  var DOCX_CONTENT_TYPES = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
    '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
    '</Types>';
  var DOCX_PACKAGE_RELS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
    '</Relationships>';
  var DOCX_DOCUMENT_RELS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
    '</Relationships>';
  // Matches the layout of Jeroen & Irene's own Word setlist template: a
  // centered "JEROEN & IRENE" heading with a rule underneath, the setlist's
  // own name below it in the same style, then one centered block per track
  // (title on its own line, "artiest – mm:ss" underneath).
  var DOCX_STYLES = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
    '<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Aptos" w:hAnsi="Aptos" w:eastAsia="Aptos" w:cs="Aptos"/><w:sz w:val="24"/><w:szCs w:val="24"/></w:rPr></w:rPrDefault>' +
      '<w:pPrDefault><w:pPr><w:spacing w:after="160" w:line="278" w:lineRule="auto"/></w:pPr></w:pPrDefault>' +
    '</w:docDefaults>' +
    '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>' +
    '</w:styles>';

  function buildSetlistDocumentXml(sl){
    var total = 0;
    var trackParagraphs = "";
    sl.trackIds.forEach(function(tid){
      var t = tracksMap.get(tid);
      var title = t ? t.title : "(verwijderd nummer)";
      var artist = t ? (t.artist || "") : "";
      var dur = t ? t.durationSec : 0;
      var programma = t ? (t.programma || "") : "";
      total += dur;
      var meta = (artist ? escapeHtml(artist) + " – " : "") + escapeHtml(formatDuration(dur)) + (programma ? " · " + escapeHtml(programma) : "");
      trackParagraphs += '' +
        '<w:p><w:pPr><w:spacing w:line="240" w:lineRule="auto"/><w:jc w:val="center"/></w:pPr>' +
          '<w:r><w:rPr><w:sz w:val="44"/><w:szCs w:val="44"/></w:rPr><w:t xml:space="preserve">' + escapeHtml(title) + '</w:t></w:r>' +
          '<w:r><w:br/></w:r>' +
          '<w:r><w:t xml:space="preserve">' + meta + '</w:t></w:r>' +
          '<w:r><w:br/></w:r>' +
        '</w:p>';
    });
    var body = '' +
      '<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="4" w:space="1" w:color="auto"/></w:pBdr><w:jc w:val="center"/></w:pPr>' +
        '<w:r><w:rPr><w:b/><w:bCs/><w:sz w:val="46"/><w:szCs w:val="46"/></w:rPr><w:t xml:space="preserve">JEROEN &amp; IRENE</w:t></w:r>' +
      '</w:p>' +
      '<w:p><w:pPr><w:jc w:val="center"/></w:pPr>' +
        '<w:r><w:rPr><w:b/><w:bCs/><w:sz w:val="46"/><w:szCs w:val="46"/></w:rPr><w:t xml:space="preserve">' + escapeHtml(sl.name) + '</w:t></w:r>' +
      '</w:p>' +
      '<w:p><w:pPr><w:spacing w:line="360" w:lineRule="auto"/></w:pPr></w:p>' +
      trackParagraphs +
      '<w:p><w:pPr><w:jc w:val="center"/></w:pPr>' +
        '<w:r><w:rPr><w:color w:val="666666"/><w:sz w:val="18"/></w:rPr><w:t xml:space="preserve">Totale duur: ' + escapeHtml(formatDuration(total)) + '</w:t></w:r>' +
      '</w:p>' +
      '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1417" w:right="1417" w:bottom="1417" w:left="1417" w:header="708" w:footer="708" w:gutter="0"/><w:cols w:space="708"/><w:docGrid w:linePitch="360"/></w:sectPr>';
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>' + body + '</w:body></w:document>';
  }

  var jsZipLoadPromise = null;
  function loadJsZip(){
    if (window.JSZip) return Promise.resolve(window.JSZip);
    if (jsZipLoadPromise) return jsZipLoadPromise;
    jsZipLoadPromise = new Promise(function(resolve, reject){
      var s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
      s.onload = function(){
        if (window.JSZip) resolve(window.JSZip);
        else reject(new Error("JSZip kon niet worden geïnitialiseerd."));
      };
      s.onerror = function(){ jsZipLoadPromise = null; reject(new Error("JSZip kon niet worden geladen.")); };
      document.head.appendChild(s);
    });
    return jsZipLoadPromise;
  }
  function buildSetlistDocxBlob(sl, JSZipCtor){
    var zip = new JSZipCtor();
    zip.file("[Content_Types].xml", DOCX_CONTENT_TYPES);
    zip.folder("_rels").file(".rels", DOCX_PACKAGE_RELS);
    var wordFolder = zip.folder("word");
    wordFolder.file("document.xml", buildSetlistDocumentXml(sl));
    wordFolder.file("styles.xml", DOCX_STYLES);
    wordFolder.folder("_rels").file("document.xml.rels", DOCX_DOCUMENT_RELS);
    return zip.generateAsync({
      type: "blob",
      mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
    });
  }

  // PDF export: lazy-loads jsPDF from cdnjs on first use.
  var jsPdfLoadPromise = null;
  function loadJsPdf(){
    if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
    if (jsPdfLoadPromise) return jsPdfLoadPromise;
    jsPdfLoadPromise = new Promise(function(resolve, reject){
      var s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js";
      s.onload = function(){
        if (window.jspdf && window.jspdf.jsPDF) resolve(window.jspdf.jsPDF);
        else reject(new Error("jsPDF kon niet worden geïnitialiseerd."));
      };
      s.onerror = function(){ jsPdfLoadPromise = null; reject(new Error("jsPDF kon niet worden geladen.")); };
      document.head.appendChild(s);
    });
    return jsPdfLoadPromise;
  }
  // Matches the layout of Jeroen & Irene's own Word setlist template: a
  // centered "JEROEN & IRENE" heading with a rule underneath, the setlist's
  // own name below it in the same style, then one centered block per track
  // (title on its own line, "artiest – mm:ss" underneath).
  function buildSetlistPdfBlob(sl, jsPDFCtor){
    var doc = new jsPDFCtor({unit:"pt", format:"a4"});
    var pageWidth = doc.internal.pageSize.getWidth();
    var pageHeight = doc.internal.pageSize.getHeight();
    var marginX = 71;
    var centerX = pageWidth / 2;
    var y = 80;

    doc.setFont("helvetica","bold"); doc.setFontSize(23); doc.setTextColor(20);
    doc.text("JEROEN & IRENE", centerX, y, {align:"center"});
    y += 10;
    doc.setDrawColor(20);
    doc.line(marginX, y, pageWidth - marginX, y);
    y += 34;
    doc.text(sl.name, centerX, y, {align:"center"});
    y += 46;

    var total = 0;
    sl.trackIds.forEach(function(tid){
      var t = tracksMap.get(tid);
      var title = t ? t.title : "(verwijderd nummer)";
      var artist = t ? (t.artist || "") : "";
      var dur = t ? t.durationSec : 0;
      var programma = t ? (t.programma || "") : "";
      total += dur;
      if (y > pageHeight - 100){ doc.addPage(); y = 80; }
      doc.setFont("helvetica","normal"); doc.setFontSize(22); doc.setTextColor(20);
      doc.text(title, centerX, y, {align:"center"});
      y += 24;
      doc.setFontSize(12);
      var meta = (artist ? artist + " – " : "") + formatDuration(dur) + (programma ? " · " + programma : "");
      doc.text(meta, centerX, y, {align:"center"});
      y += 40;
    });

    if (y > pageHeight - 60){ doc.addPage(); y = 80; }
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(140);
    doc.text("Totale duur: " + formatDuration(total), centerX, y, {align:"center"});

    return doc.output("blob");
  }

  function exportFormatLabel(format){
    return format === "pdf" ? "PDF" : format === "docx" ? "Word" : "CSV";
  }
  function buildExportPayload(sl, format){
    if (format === "docx"){
      return loadJsZip().then(function(JSZipCtor){
        return buildSetlistDocxBlob(sl, JSZipCtor).then(function(blob){
          return {blob: blob, ext: "docx"};
        });
      });
    }
    if (format === "pdf"){
      return loadJsPdf().then(function(jsPDFCtor){
        return {blob: buildSetlistPdfBlob(sl, jsPDFCtor), ext:"pdf"};
      });
    }
    return Promise.resolve({blob: new Blob([buildSetlistCsv(sl)], {type:"text/csv;charset=utf-8;"}), ext:"csv"});
  }

  async function exportSetlist(id, format){
    var sl = setlistsMap.get(id);
    if (!sl) return;
    if (songCount(sl) < 3){
      showBanner("Een setlist moet minstens 3 nummers bevatten voordat je kunt exporteren.", "warn");
      return;
    }
    var baseName = (sl.name || "setlist").replace(/[\\/:*?"<>|]+/g, "").trim() || "setlist";
    var payload;
    try{
      payload = await buildExportPayload(sl, format);
    } catch(e){
      showBanner("Exporteren als " + exportFormatLabel(format) + " is niet gelukt: " + (e && e.message ? e.message : "onbekende fout") + ".", "warn");
      return;
    }
    var filename = baseName + "." + payload.ext;

    try{
      var downloads = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null;
      if (downloads){
        await downloads.save({filename: filename, data: payload.blob});
        showBanner("“" + sl.name + "” is geëxporteerd als " + exportFormatLabel(format) + ".", "success");
        return;
      }
    } catch(e){
      if (e && e.code === "declined") return;
      // fall through to the plain-browser download below
    }
    if (downloadBlobViaBrowser(payload.blob, filename)){
      showBanner("“" + sl.name + "” is gedownload als " + exportFormatLabel(format) + ".", "success");
    } else {
      showBanner("Exporteren is niet gelukt. Probeer het opnieuw.", "warn");
    }
  }

  // ---------- drag & drop ----------
  function getDropIndex(container, clientY, excludeEl, itemSelector){
    var items = Array.prototype.slice.call(container.querySelectorAll(itemSelector || ".setlist-track-item")).filter(function(el){ return el !== excludeEl; });
    for (var i=0;i<items.length;i++){
      var rect = items[i].getBoundingClientRect();
      var mid = rect.top + rect.height/2;
      if (clientY < mid) return i;
    }
    return items.length;
  }

    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("application/x-reorder-index", item.getAttribute("data-index"));
  });
  editorPanelEl.addEventListener("dragend", function(e){
    var item = e.target.closest ? e.target.closest(".setlist-track-item") : null;
    if (item) item.classList.remove("dragging");
    if (dropIndicator.parentNode) dropIndicator.parentNode.removeChild(dropIndicator);
  });
  editorPanelEl.addEventListener("dragover", function(e){
    var types = e.dataTransfer.types;
    var hasTrack = Array.prototype.indexOf.call(types, "application/x-track-id") !== -1;
    var hasReorder = Array.prototype.indexOf.call(types, "application/x-reorder-index") !== -1;
    if (!hasTrack && !hasReorder) return;

    if (!activeSetlistId){
      // No setlist yet: dragging a library track over the empty-state
      // placeholder is a valid drop that will create one for it. A
      // reorder drag can't reach here (nothing to reorder without a
      // setlist), so only library-track drags are accepted.
      if (!hasTrack) return;
      var emptyEl = document.getElementById("editor-empty-dropzone");
      if (!emptyEl || !(emptyEl.contains(e.target) || e.target === emptyEl)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "copy";
      emptyEl.classList.add("drop-target");
      return;
    }

    var listEl = document.getElementById("setlist-track-list");
    if (!listEl) return;
    var within = listEl.contains(e.target) || e.target === listEl;
    if (!within) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = hasReorder ? "move" : "copy";
    var dragging = listEl.querySelector(".dragging");
    var idx = getDropIndex(listEl, e.clientY, dragging);
    var items = Array.prototype.slice.call(listEl.querySelectorAll(".setlist-track-item")).filter(function(el){ return el !== dragging; });
    var ref = items[idx] || null;
    listEl.insertBefore(dropIndicator, ref);
  });

    if (!activeSetlistId){
      var emptyEl = document.getElementById("editor-empty-dropzone");

      var withinEmpty = emptyEl && (emptyEl.contains(e.target) || e.target === emptyEl);
      if (!withinEmpty) return;
      e.preventDefault();
      var newTrackId = e.dataTransfer.getData("application/x-track-id");
      if (!newTrackId) return;
      createSetlistWithTrack("Setlist " + (setlistsMap.size + 1), newTrackId);
      return;
    }

    var listEl = document.getElementById("setlist-track-list");
    if (!listEl) return;
    var within = listEl.contains(e.target) || e.target === listEl;
    if (!within) return;
    e.preventDefault();
    if (dropIndicator.parentNode) dropIndicator.parentNode.removeChild(dropIndicator);
    var trackId = e.dataTransfer.getData("application/x-track-id");
    var reorderIdxStr = e.dataTransfer.getData("application/x-reorder-index");
    var dragging = listEl.querySelector(".dragging");
    var idx = getDropIndex(listEl, e.clientY, dragging);
    if (trackId){
      mutateSetlist(activeSetlistId, function(ids){ ids.splice(idx, 0, trackId); return ids; });
    } else if (reorderIdxStr !== ""){
      var fromIdx = parseInt(reorderIdxStr, 10);
      mutateSetlist(activeSetlistId, function(ids){
        var copy = ids.slice();
        var moved = copy.splice(fromIdx, 1)[0];
        // idx already comes from getDropIndex(), which excludes the
        // dragged item from its own indexing — so it's already an index
        // into `copy` (post-removal) and needs no further adjustment.
        copy.splice(idx, 0, moved);
        return copy;
      });
    }
  });
