  editorPanelEl.addEventListener("click", function(e){
    var rmBtn = e.target.closest && e.target.closest('[data-action="remove-track"]');
    if (rmBtn){
      var idxRm = parseInt(rmBtn.getAttribute("data-index"), 10);
      mutateSetlist(activeSetlistId, function(ids){ var copy = ids.slice(); copy.splice(idxRm,1); return copy; });
      return;
    }
    var exportBtn = e.target.closest && e.target.closest('[data-action="export-setlist"]');
    if (exportBtn && !exportBtn.disabled){
      var formatModal = document.getElementById("export-format-modal");
      if (formatModal) formatModal.hidden = false;
      return;
    }
    if (e.target.id === "open-add-existing-track-btn" || (e.target.closest && e.target.closest("#open-add-existing-track-btn"))){
      openAddExistingTrackModal();
      return;
    }
  });
  editorPanelEl.addEventListener("focusout", function(e){
    if (e.target.id === "setlist-name-input" && activeSetlistId){
      var val = e.target.value.trim();
      var sl = setlistsMap.get(activeSetlistId);
      if (sl && val && val !== sl.name) renameSetlist(activeSetlistId, val);
      else if (sl) e.target.value = sl.name;
    }
  });
  editorPanelEl.addEventListener("change", function(e){
    if (e.target.id === "setlist-date-input" && activeSetlistId){
      var sl = setlistsMap.get(activeSetlistId);
      if (sl && e.target.value !== (sl.date || "")) updateSetlistDate(activeSetlistId, e.target.value);
    }
  });
  editorPanelEl.addEventListener("keydown", function(e){
    if (e.target.id === "setlist-name-input" && e.key === "Enter"){
      e.preventDefault();
      e.target.blur();
    }
  });

  // ---------- resizable & reorderable panels ----------
  // Columns are sized in `fr` units (proportional shares of the available
  // width), so they automatically rescale together whenever the window is
  // resized — no resize listener needed, the grid does it natively.
  // While actively dragging a handle we track the mouse 1:1 in pixels for a
  // direct feel, then convert the result back to a ratio when the drag
  // ends, so the next window resize keeps that same proportion.
  //
  // Which panel's content lands in which grid slot is independent of
  // width: `panelOrder` holds the current left-to-right arrangement of the
  // three panel ids, applied via the CSS `order` property, so any panel
  // can be moved into any of the three positions (e.g. the active setlist
  // entirely on the left, or in the middle). Each panel remembers its own
  // width preference; only the first two slots are directly resizable via
  // a drag handle — the third/rightmost slot always takes the remaining
  // space, whichever panel currently occupies it.
  var PANEL_WIDTHS_KEY = "setlist-studio:panel-widths";
  var PANEL_WIDTHS_PX_KEY = "setlist-studio:panel-widths-px";
  var PANEL_ORDER_KEY = "setlist-studio:panel-order";
  var DEFAULT_PANEL_ORDER = ["library", "setlists", "editor"];
  var DEFAULT_PANEL_FR = {library: 1.75, setlists: 1.55, editor: 1.75};
  var PANEL_LABELS = {library: "Bibliotheek", setlists: "Setlists", editor: "Actieve setlist"};
  var PANEL_SECTION_IDS = {library: "panel-library", setlists: "panel-setlists", editor: "panel-editor"};
  var RESIZE_MIN_PX = 240;
  var RESIZE_MAX_PX = 1400;
  var STACK_BREAKPOINT = 980;

  var panelOrder = DEFAULT_PANEL_ORDER.slice();
  var panelWidths = Object.assign({}, DEFAULT_PANEL_FR);
  var panelWidthsPx = {};

  function clampPx(v){ return Math.max(RESIZE_MIN_PX, Math.min(RESIZE_MAX_PX, v)); }
  function panelPx(el){ return el ? el.getBoundingClientRect().width : 0; }
  function panelSectionEl(id){ return document.getElementById(PANEL_SECTION_IDS[id]); }

  function savePanelWidths(){
    try{ window.localStorage.setItem(PANEL_WIDTHS_KEY, JSON.stringify(panelWidths)); } catch(e){ /* ignore */ }
    try{ window.localStorage.setItem(PANEL_WIDTHS_PX_KEY, JSON.stringify(panelWidthsPx)); } catch(e){ /* ignore */ }
  }
  function loadPanelWidths(){
    try{
      var rawPx = window.localStorage.getItem(PANEL_WIDTHS_PX_KEY);
      if (rawPx){
        var pxObj = JSON.parse(rawPx);
        if (pxObj) DEFAULT_PANEL_ORDER.forEach(function(id){
          if (typeof pxObj[id] === "number") panelWidthsPx[id] = clampPx(pxObj[id]);
        });
      }
      var raw = window.localStorage.getItem(PANEL_WIDTHS_KEY);
      if (raw){
        var obj = JSON.parse(raw);
        if (obj) DEFAULT_PANEL_ORDER.forEach(function(id){
          if (typeof obj[id] === "number") panelWidths[id] = obj[id];
        });
      }
    } catch(e){ /* ignore */ }
  }
  function savePanelOrder(){
    try{ window.localStorage.setItem(PANEL_ORDER_KEY, JSON.stringify(panelOrder)); } catch(e){ /* ignore */ }
  }
  function loadPanelOrder(){
    try{
      var raw = window.localStorage.getItem(PANEL_ORDER_KEY);
      if (!raw) return;
      var obj = JSON.parse(raw);
      if (Array.isArray(obj) && obj.length === 3 &&
          DEFAULT_PANEL_ORDER.slice().sort().join(",") === obj.slice().sort().join(",")) panelOrder = obj;
    } catch(e){ /* ignore */ }
  }

  function panelDragHandleHtml(panelId){
    return '<span class="panel-drag-handle-mobile" draggable="true" data-panel="' + panelId + '" aria-label="' +
      PANEL_LABELS[panelId] + '-blok verslepen om te verplaatsen" title="Sleep om te verplaatsen">' + ICON_HANDLE + '</span>';
  }

  function applyPanelLayout(){
    var layoutEl = document.querySelector(".layout");
    panelOrder.forEach(function(id, i){
      var section = panelSectionEl(id);
      if (section) section.style.order = i * 2;
    });
    var handle1 = document.getElementById("resize-handle-1");
    var handle2 = document.getElementById("resize-handle-2");
    if (handle1) handle1.style.order = 1;
    if (handle2) handle2.style.order = 3;
    var id1 = panelOrder[0], id2 = panelOrder[1];
    if (typeof panelWidthsPx[id1] === "number") layoutEl.style.setProperty("--w-col1", clampPx(panelWidthsPx[id1]) + "px");
    else layoutEl.style.setProperty("--w-col1", panelWidths[id1] + "fr");
    if (typeof panelWidthsPx[id2] === "number") layoutEl.style.setProperty("--w-col2", clampPx(panelWidthsPx[id2]) + "px");
    else layoutEl.style.setProperty("--w-col2", panelWidths[id2] + "fr");
  }

  var panelDragId = null;
  var panelDragSection = null;
  function panelIdForSection(section){
    var found = null;
    DEFAULT_PANEL_ORDER.forEach(function(id){ if (panelSectionEl(id) === section) found = id; });
    return found;
  }
  function clearPanelDropTargets(){
    DEFAULT_PANEL_ORDER.forEach(function(id){ var section = panelSectionEl(id); if (section) section.classList.remove("panel-drop-target"); });
  }
  function initPanelReorder(){
    DEFAULT_PANEL_ORDER.forEach(function(id){
      var section = panelSectionEl(id), header = section ? section.querySelector(".panel-header") : null;
      if (!header || header.querySelector(".panel-drag-handle-mobile")) return;
      var actions = header.querySelector(".panel-header-actions");
      if (actions) actions.insertAdjacentHTML("beforeend", panelDragHandleHtml(id));
      else header.insertAdjacentHTML("beforeend", '<span class="panel-header-actions">' + panelDragHandleHtml(id) + '</span>');
    });
    var layoutEl = document.querySelector(".layout");
    layoutEl.addEventListener("dragstart", function(e){
      var handle = e.target.closest && e.target.closest(".panel-drag-handle-mobile");
      if (!handle) return;
      panelDragId = handle.getAttribute("data-panel"); panelDragSection = panelSectionEl(panelDragId);
      if (panelDragSection) panelDragSection.classList.add("panel-dragging");
      e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("application/x-panel-reorder", panelDragId);
    });
    layoutEl.addEventListener("dragend", function(){
      if (panelDragSection) panelDragSection.classList.remove("panel-dragging");
      clearPanelDropTargets(); panelDragId = null; panelDragSection = null;
    });
    layoutEl.addEventListener("dragover", function(e){
      if (!panelDragId) return;
      if (Array.prototype.indexOf.call(e.dataTransfer.types, "application/x-panel-reorder") === -1) return;
      var targetSection = e.target.closest && e.target.closest(".panel"); if (!targetSection) return;
      e.preventDefault(); e.dataTransfer.dropEffect = "move"; clearPanelDropTargets();
      var targetId = panelIdForSection(targetSection); if (targetId && targetId !== panelDragId) targetSection.classList.add("panel-drop-target");
    });
    layoutEl.addEventListener("drop", function(e){
      if (!panelDragId) return;
      if (Array.prototype.indexOf.call(e.dataTransfer.types, "application/x-panel-reorder") === -1) return;
      var targetSection = e.target.closest && e.target.closest(".panel"); clearPanelDropTargets(); if (!targetSection){ panelDragId=null; return; }
      e.preventDefault(); var targetId=panelIdForSection(targetSection), draggedId=panelDragId; panelDragId=null;
      if (!targetId || targetId===draggedId) return;
      var rect=targetSection.getBoundingClientRect(), before=e.clientX < rect.left+rect.width/2, copy=panelOrder.slice(), fromIdx=copy.indexOf(draggedId);
      if (fromIdx===-1) return; copy.splice(fromIdx,1); var insertAt=copy.indexOf(targetId); if (insertAt===-1) return;
      if (!before) insertAt+=1; copy.splice(insertAt,0,draggedId); panelOrder=copy; savePanelOrder(); applyPanelLayout();
    });
  }

  function initResizers(){
    var layoutEl = document.querySelector(".layout");
    function slotEl(slotIndex){ return panelSectionEl(panelOrder[slotIndex]); }
    function lockCurrentWidths(){
      [0,1].forEach(function(i){
        var id=panelOrder[i], px=panelPx(slotEl(i));
        if (px>0) panelWidthsPx[id]=clampPx(px);
      });
      if (typeof panelWidthsPx[panelOrder[0]] === "number") layoutEl.style.setProperty("--w-col1", panelWidthsPx[panelOrder[0]]+"px");
      if (typeof panelWidthsPx[panelOrder[1]] === "number") layoutEl.style.setProperty("--w-col2", panelWidthsPx[panelOrder[1]]+"px");
      savePanelWidths();
    }
    function dynamicMaxPx(slotIndex){
      var other = slotIndex === 0 ? panelPx(slotEl(1)) : panelPx(slotEl(0));
      var reserve = other + 14 + 14 + 320 + 32;
      return Math.max(RESIZE_MIN_PX, Math.min(RESIZE_MAX_PX, window.innerWidth-reserve));
    }
    function setupResizeHandle(handle, slotIndex, colVar){
      if (!handle) return;
      var dragging=false,startX=0,startWidth=0;
      handle.addEventListener("pointerdown",function(e){
        if(window.innerWidth<STACK_BREAKPOINT)return;
        lockCurrentWidths(); dragging=true; startX=e.clientX; startWidth=panelPx(slotEl(slotIndex));
        try{handle.setPointerCapture(e.pointerId);}catch(err){} document.body.style.userSelect="none";
      });
      handle.addEventListener("pointermove",function(e){
        if(!dragging)return;
        var next=Math.max(RESIZE_MIN_PX,Math.min(dynamicMaxPx(slotIndex),startWidth+(e.clientX-startX)));
        layoutEl.style.setProperty(colVar,next+"px");
      });
      function endDrag(){
        if(!dragging)return; dragging=false; document.body.style.userSelect="";
        var id=panelOrder[slotIndex], px=panelPx(slotEl(slotIndex)); panelWidthsPx[id]=clampPx(px); savePanelWidths();
      }
      handle.addEventListener("pointerup",endDrag); handle.addEventListener("pointercancel",endDrag);
      handle.addEventListener("keydown",function(e){
        if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return; e.preventDefault(); lockCurrentWidths();
        var next=Math.max(RESIZE_MIN_PX,Math.min(dynamicMaxPx(slotIndex),panelPx(slotEl(slotIndex))+(e.key==="ArrowRight"?24:-24)));
        layoutEl.style.setProperty(colVar,next+"px"); panelWidthsPx[panelOrder[slotIndex]]=clampPx(next); savePanelWidths();
      });
    }
    lockCurrentWidths();
    setupResizeHandle(document.getElementById("resize-handle-1"),0,"--w-col1");
    setupResizeHandle(document.getElementById("resize-handle-2"),1,"--w-col2");
  }

  function initPanelLayout(){
    loadPanelOrder();
    loadPanelWidths();
    initPanelReorder();
    applyPanelLayout();
    initResizers();
  }

  // ---------- settings panel (cloud sync) ----------
  var settingsBtn = document.getElementById("settings-btn");
  var settingsPanelEl = document.getElementById("settings-panel");
  var settingsOverlayEl = document.getElementById("settings-overlay");
  function openSettingsPanel(){
    if (!settingsOverlayEl) return;
    settingsOverlayEl.hidden = false;
    renderSettingsPanel();
  }
  function closeSettingsPanel(){
    if (!settingsOverlayEl) return;
    settingsOverlayEl.hidden = true;
  }
  if (settingsBtn && settingsPanelEl && settingsOverlayEl){
    settingsBtn.addEventListener("click", function(){
      if (settingsOverlayEl.hidden) openSettingsPanel(); else closeSettingsPanel();
    });
    settingsOverlayEl.addEventListener("click", function(e){
      if (e.target === settingsOverlayEl) closeSettingsPanel();
    });
    settingsOverlayEl.addEventListener("keydown", function(e){
      if (e.key === "Escape") closeSettingsPanel();
    });
    var settingsCloseBtn = document.getElementById("settings-close-btn");
    if (settingsCloseBtn){
      settingsCloseBtn.addEventListener("click", closeSettingsPanel);
    }
    settingsPanelEl.addEventListener("click", function(e){
      if (e.target.id === "connect-cloud-btn"){ handleConnectFirebase(); return; }
      if (e.target.id === "disconnect-cloud-btn"){ handleDisconnectFirebase(); return; }
      if (e.target.id === "reenable-cloud-btn"){ handleReenableFirebase(); return; }
      if (e.target.id === "auth-logout-btn"){ handleAuthLogout(); return; }
      if (e.target.id === "upload-btn" || (e.target.closest && e.target.closest("#upload-btn"))){
        var fileInput = document.getElementById("file-input");
        if (fileInput) fileInput.click();
        return;
      }
      if (e.target.id === "upload-setlists-btn" || (e.target.closest && e.target.closest("#upload-setlists-btn"))){
        var setlistFileInput = document.getElementById("setlist-docx-input");
        if (setlistFileInput) setlistFileInput.click();
        return;
      }
      if (e.target.id === "theme-save-btn"){
        var nameInput = document.getElementById("theme-save-name");
        var name = nameInput ? nameInput.value.trim() : "";
        if (!name){
          if (nameInput) nameInput.focus();
          return;
        }
        var list = loadSavedThemes();
        var theme = currentTheme();
        var existing = null;
        for (var i=0;i<list.length;i++){
          if (list[i].name.toLowerCase() === name.toLowerCase()){
            existing = list[i];
            break;
          }
        }
        if (existing){
          existing.name = name;
          existing.theme = Object.assign({}, theme);
        } else {
          list.push({id:themeId(), name:name, theme:Object.assign({}, theme)});
        }
        saveSavedThemes(list);
        saveThemeOverride(theme);
        applyTheme(theme);
        renderSettingsPanel();
        return;
      }
      var themeActionBtn = e.target.closest && e.target.closest("[data-theme-action]");
      if (themeActionBtn){
        var action = themeActionBtn.getAttribute("data-theme-action");
        var id = themeActionBtn.getAttribute("data-theme-id");
        var list = loadSavedThemes();
        var item = null;
        for (var i=0;i<list.length;i++){
          if (list[i].id === id){ item = list[i]; break; }
        }
        if (!item) return;
        if (action === "apply" || action === "set-default"){
          var theme = Object.assign({}, DEFAULT_THEME, item.theme);
          saveThemeOverride(theme);
          applyTheme(theme);
          if (action === "set-default") saveDefaultThemeId(item.id);
          renderSettingsPanel();
          return;
        }
        if (action === "unset-default"){
          clearDefaultThemeId();
          renderSettingsPanel();
          return;
        }
        if (action === "delete"){
          list = list.filter(function(x){ return x.id !== id; });
          saveSavedThemes(list);
          if (loadDefaultThemeId() === id) clearDefaultThemeId();
          renderSettingsPanel();
          return;
        }
      }
      if (e.target.id === "theme-reset-btn"){
        clearThemeOverride();
        applyTheme(currentTheme());
        renderSettingsPanel();
        return;
      }
      if (e.target.id === "backup-export-btn" || (e.target.closest && e.target.closest("#backup-export-btn"))){
        handleBackupExport();
        return;
      }
      if (e.target.id === "backup-import-btn" || (e.target.closest && e.target.closest("#backup-import-btn"))){
        var backupInput = document.getElementById("backup-import-input");
        if (backupInput) backupInput.click();
        return;
      }
    });
    settingsPanelEl.addEventListener("input", function(e){
      if (!e.target.id || e.target.id.indexOf("theme-") !== 0) return;
      var themeInputMap = {
        "theme-bg": "bg", "theme-surface": "surface", "theme-surface2": "surface2", "theme-border": "border",
        "theme-accent": "accent", "theme-text": "text", "theme-textmuted": "textMuted", "theme-shadow": "shadowColor",
    "theme-resize-handle": "resizeHandleColor"
      };
      var themeKey = themeInputMap[e.target.id];
      if (!themeKey) return;
      var theme = currentTheme();
      theme[themeKey] = e.target.value;
      applyTheme(theme);
      saveThemeOverride(theme);
    });
    settingsPanelEl.addEventListener("submit", function(e){
      if (e.target.id === "settings-login-form"){
        e.preventDefault();
        var u = document.getElementById("settings-login-username");
        var p = document.getElementById("settings-login-password");
        var errorEl = document.getElementById("settings-login-error");
        handleAuthLogin(u ? u.value.trim() : "", p ? p.value : "", errorEl);
      }
    });
    settingsPanelEl.addEventListener("change", function(e){
      if (e.target.id === "require-login-toggle"){
        handleToggleRequireLogin(e.target.checked);
        return;
      }
      if (e.target.id === "show-programma-toggle"){
        showProgrammaInLibrary = e.target.checked;
        saveShowProgrammaSetting(showProgrammaInLibrary);
        renderLibrary();
        renderActiveSetlist();
        return;
      }
      if (e.target.id === "file-input"){
        var file = e.target.files && e.target.files[0];
        e.target.value = "";
        if (file) handleFileImport(file);
        return;
      }
      if (e.target.id === "backup-import-input"){
        var backupFile = e.target.files && e.target.files[0];
        e.target.value = "";
        if (backupFile) handleBackupImportFile(backupFile);
        return;
      }
      if (e.target.id === "setlist-docx-input"){
        var docxFile = e.target.files && e.target.files[0];
        e.target.value = "";
        if (docxFile) handleSetlistDocxImport(docxFile);
      }
    });
  }

  // ---------- auth gate (full-page login when required and not signed in) ----------
  if (authGateEl){
    authGateEl.addEventListener("submit", function(e){
      if (e.target.id === "auth-gate-form"){
        e.preventDefault();
        var u = document.getElementById("auth-gate-username");
        var p = document.getElementById("auth-gate-password");
        var errorEl = document.getElementById("auth-gate-error");
        handleAuthLogin(u ? u.value.trim() : "", p ? p.value : "", errorEl);
      }
    });
  }


  // ---------- mobile accordions ----------
  var MOBILE_MEDIA_QUERY = window.matchMedia("(max-width: 980px)");

  function isMobileLayout(){
    return MOBILE_MEDIA_QUERY.matches;
  }

  function setMobilePanelCollapsed(panel, collapsed){
    if (!panel) return;
    panel.classList.toggle("is-collapsed", !!collapsed);
    var header = panel.querySelector(".panel-header");
    if (header) header.setAttribute("aria-expanded", collapsed ? "false" : "true");
  }

  function initMobileAccordions(){
    var panels = [
      document.getElementById("panel-setlists"),
      document.getElementById("panel-editor"),
      document.getElementById("panel-library")
    ];

    panels.forEach(function(panel){
      if (!panel) return;
      var header = panel.querySelector(".panel-header");
      if (!header || header.getAttribute("data-mobile-accordion") === "1") return;

      header.setAttribute("data-mobile-accordion","1");
      header.setAttribute("role","button");
      header.setAttribute("tabindex","0");

      function toggle(){
        if (isMobileLayout()) {
          setMobilePanelCollapsed(panel, !panel.classList.contains("is-collapsed"));
        }
      }

      header.addEventListener("click", function(e){
        if (e.target.closest && e.target.closest("button,input,a")) return;
        toggle();
      });

      header.addEventListener("keydown", function(e){
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          toggle();
        }
      });
    });

    if (isMobileLayout()){
      /* Setlists open for selection; active setlist closed; library open. */
      setMobilePanelCollapsed(document.getElementById("panel-setlists"), false);
      setMobilePanelCollapsed(document.getElementById("panel-editor"), true);
      setMobilePanelCollapsed(document.getElementById("panel-library"), false);
    }
  }

  function mobileSetlistSelected(){
    if (!isMobileLayout()) return;
    setMobilePanelCollapsed(document.getElementById("panel-setlists"), true);
    setMobilePanelCollapsed(document.getElementById("panel-editor"), true);
  }

  initMobileAccordions();

  if (MOBILE_MEDIA_QUERY.addEventListener){
    MOBILE_MEDIA_QUERY.addEventListener("change", initMobileAccordions);
  } else if (MOBILE_MEDIA_QUERY.addListener){
    MOBILE_MEDIA_QUERY.addListener(initMobileAccordions);
  }

  // ---------- boot ----------
  applyTheme(currentTheme());
  initPanelLayout();
  initStore();
})();
</script>
